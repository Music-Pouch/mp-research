[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mp-research"
version = "0.1.0"
description = "Music Pouch research-spike execution and evaluation runner"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "typer>=0.12,<1",
  "rich>=13,<15",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
gpt-researcher = ["gpt-researcher", "langchain-ollama"]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
mp-research = "mp_research.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mp_research"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
