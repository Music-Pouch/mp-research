name: Run research

on:
  workflow_dispatch:
    inputs:
      research_spike:
        description: Full URL of a Music Pouch GitHub research-spike issue
        required: true
        type: string
        default: https://github.com/Music-Pouch/mp-radio/issues/1

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      GH_TOKEN: ${{ secrets.MP_RESEARCH_GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runner and GPT Researcher
        run: pip install -e ".[gpt-researcher]"

      - name: Verify required secrets are available
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY is not configured"; exit 1; }
          test -n "$TAVILY_API_KEY" || { echo "TAVILY_API_KEY is not configured"; exit 1; }
          test -n "$GH_TOKEN" || { echo "MP_RESEARCH_GITHUB_TOKEN is not configured"; exit 1; }

      - name: Build brief from research spike
        env:
          RESEARCH_SPIKE_URL: ${{ inputs.research_spike }}
        shell: bash
        run: |
          case "$RESEARCH_SPIKE_URL" in
            https://github.com/Music-Pouch/*/issues/[0-9]*) ;;
            *) echo "research_spike must be a Music-Pouch GitHub issue URL"; exit 1 ;;
          esac

          mkdir -p .research-input
          title="$(gh issue view "$RESEARCH_SPIKE_URL" --json title --jq '.title')"
          body="$(gh issue view "$RESEARCH_SPIKE_URL" --json body --jq '.body')"
          {
            printf '# %s\n\n' "$title"
            printf '%s\n' "$body"
          } > .research-input/research-spike.md

      - name: Run GPT Researcher benchmark
        run: |
          mp-research \
            --engine gpt-researcher \
            --brief .research-input/research-spike.md \
            --out runs

      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpt-researcher-${{ github.run_id }}
          path: runs/
          if-no-files-found: warn
          retention-days: 14
