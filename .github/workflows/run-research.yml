name: Run research

on:
  workflow_dispatch:
    inputs:
      research_spike:
        description: Full URL of a Music Pouch GitHub research-spike issue
        required: true
        type: string
        default: https://github.com/Music-Pouch/mp-radio/issues/1
      provider_mode:
        description: Research provider mode. FREE GAME is the default and never uses paid API credentials.
        required: true
        type: choice
        options:
          - free-game
          - configured
        default: free-game
      retriever:
        description: Retriever override. Defaults to DuckDuckGo for the FREE GAME path.
        required: false
        type: string
        default: duckduckgo
      ollama_model:
        description: Ollama chat model used by the FREE GAME path
        required: false
        type: string
        default: qwen3:4b
      ollama_embedding_model:
        description: Ollama embedding model used by the FREE GAME path
        required: false
        type: string
        default: nomic-embed-text

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.MP_RESEARCH_GITHUB_TOKEN }}
      RETRIEVER: ${{ inputs.retriever }}
      OLLAMA_MODEL: ${{ inputs.ollama_model }}
      OLLAMA_EMBEDDING_MODEL: ${{ inputs.ollama_embedding_model }}
      MP_RESEARCH_CONDUCT_TIMEOUT_SECONDS: "900"
      MP_RESEARCH_REPORT_TIMEOUT_SECONDS: "300"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runner and GPT Researcher
        run: pip install -e ".[gpt-researcher]"

      - name: Verify GitHub token is available
        shell: bash
        run: |
          test -n "$GH_TOKEN" || { echo "MP_RESEARCH_GITHUB_TOKEN is not configured"; exit 1; }

      - name: Configure FREE GAME providers
        if: inputs.provider_mode == 'free-game'
        shell: bash
        run: |
          {
            echo "OPENAI_API_KEY=ollama"
            echo "OPENAI_API_BASE=http://127.0.0.1:11434/v1"
            echo "OPENAI_BASE_URL=http://127.0.0.1:11434/v1"
            echo "OLLAMA_BASE_URL=http://127.0.0.1:11434"
            echo "FAST_LLM=ollama:${OLLAMA_MODEL}"
            echo "SMART_LLM=ollama:${OLLAMA_MODEL}"
            echo "STRATEGIC_LLM=ollama:${OLLAMA_MODEL}"
            echo "EMBEDDING=ollama:${OLLAMA_EMBEDDING_MODEL}"
            echo "RETRIEVER=${RETRIEVER:-duckduckgo}"
          } >> "$GITHUB_ENV"

      - name: Configure optional paid providers
        if: inputs.provider_mode == 'configured'
        env:
          CONFIGURED_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CONFIGURED_TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        shell: bash
        run: |
          test -n "$CONFIGURED_OPENAI_API_KEY" || {
            echo "provider_mode=configured requires OPENAI_API_KEY"
            exit 1
          }

          {
            echo "OPENAI_API_KEY=$CONFIGURED_OPENAI_API_KEY"
            echo "TAVILY_API_KEY=$CONFIGURED_TAVILY_API_KEY"
          } >> "$GITHUB_ENV"

      - name: Install Ollama for FREE GAME path
        if: inputs.provider_mode == 'free-game'
        shell: bash
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        if: inputs.provider_mode == 'free-game'
        shell: bash
        run: |
          OLLAMA_HOST=127.0.0.1:11434 ollama serve > /tmp/ollama.log 2>&1 &
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:11434/api/version >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/ollama.log
          exit 1

      - name: Pull Ollama models
        if: inputs.provider_mode == 'free-game'
        shell: bash
        run: |
          ollama pull "${OLLAMA_MODEL}"
          ollama pull "${OLLAMA_EMBEDDING_MODEL}"

      - name: Smoke test Ollama inference
        if: inputs.provider_mode == 'free-game'
        timeout-minutes: 3
        shell: bash
        run: |
          echo "Smoke testing ${OLLAMA_MODEL} before GPT Researcher"
          jq -n \
            --arg model "$OLLAMA_MODEL" \
            '{model: $model, prompt: "Reply with exactly OK.", stream: false}' \
            | curl --fail --show-error --silent \
                --max-time 170 \
                --header 'Content-Type: application/json' \
                --data-binary @- \
                http://127.0.0.1:11434/api/generate \
            | tee /tmp/ollama-smoke.json
          echo
          jq -e '.response | length > 0' /tmp/ollama-smoke.json >/dev/null
          echo "Ollama inference smoke test passed"

      - name: Build brief from research spike
        env:
          RESEARCH_SPIKE_URL: ${{ inputs.research_spike }}
        shell: bash
        run: |
          case "$RESEARCH_SPIKE_URL" in
            https://github.com/Music-Pouch/*/issues/[0-9]*) ;;
            *) echo "research_spike must be a Music-Pouch GitHub issue URL"; exit 1 ;;
          esac

          mkdir -p .research-input
          title="$(gh issue view "$RESEARCH_SPIKE_URL" --json title --jq '.title')"
          body="$(gh issue view "$RESEARCH_SPIKE_URL" --json body --jq '.body')"
          {
            printf '# %s\n\n' "$title"
            printf '%s\n' "$body"
          } > .research-input/research-spike.md

      - name: Run GPT Researcher
        timeout-minutes: 20
        run: |
          echo "Research phase timeout: ${MP_RESEARCH_CONDUCT_TIMEOUT_SECONDS}s"
          echo "Report phase timeout: ${MP_RESEARCH_REPORT_TIMEOUT_SECONDS}s"
          mp-research \
            --engine gpt-researcher \
            --brief .research-input/research-spike.md \
            --out runs

      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpt-researcher-${{ github.run_id }}
          path: runs/
          if-no-files-found: warn
          retention-days: 14

      - name: Print Ollama log on failure
        if: failure() && inputs.provider_mode == 'free-game'
        shell: bash
        run: |
          echo "===== Ollama server log ====="
          cat /tmp/ollama.log || true
          echo "===== Ollama smoke response ====="
          cat /tmp/ollama-smoke.json || true
